<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Task 1.3</title>
</head>

<body>
    <form action="https://httpbin.io/dump/request" method="POST">
        <p>
            <label for="name">Enter your name:</label>
            <input type="text" id="name" name="name">
        </p>

        <p>
            <label for="em">Enter your email:</label>
            <input type="email" id="em" name="email">
        </p>

        <p>
            <!-- Data Picker Widget -->
            <input type="date" name="date" id="date" />
        </p>

        <p>
            <!-- Colour Picker Widget -->
            <input type="color" name="color" id="color" />
        </p>

        <fieldset>
            <legend>Are you a member of staff or a student?</legend>
            <ul>
                <li>
                    <label for="staff">Member of Staff</label>
                    <input type="radio" id="staff" value="staff" checked />
                </li>
                <li>
                    <label for="student">Student</label>
                    <input type="radio" id="student" value="student" />
                </li>
            </ul>
        </fieldset>


        <p>
            <input type="submit">
        </p>
    </form>
</body>

</html>
